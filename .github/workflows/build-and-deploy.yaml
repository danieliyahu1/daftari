name: Build and deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - deploy/**
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build
      - name: Install kubeconform
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar --extract --gzip --file - --directory "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: kubeconform -strict -summary deploy/

  publish:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "reference=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.reference }}

  promote:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          sed -i "s|^          image: ghcr.io/danieliyahu1/daftari:.*$|          image: ${IMAGE}|" deploy/deployment.yaml
      - run: git diff --check
      - run: |
          if ! git diff --quiet -- deploy/deployment.yaml; then
            git commit -am "chore: promote image ${{ github.sha }}"
          fi
      - run: git push
